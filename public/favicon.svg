<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      @font-face {
        font-family: 'InterFav';
        src: url(data:font/ttf;base64,) format('truetype');
        font-weight: 800;
      }
    </style>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#090a0f"/>
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#78809199" stroke-width="0.8"/>
  <text x="32" y="46" font-family="InterFav, sans-serif" font-weight="800" font-size="40"
        text-anchor="middle" fill="#ff8c00" filter="url(#glow)">B</text>
</svg>